<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L1MA0 · 个人网页</title>
  <meta name="description" content="此网站收录本人所遇奇异搞笑事件。">
  <meta name="author" content="L1MA0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="L1MA0的个人网页">
  <meta property="og:description" content="此网站收录本人所遇奇异搞笑事件。">
  <meta property="og:image" content="https://politeelm.github.io/Blog/assets/images/favicon-512.png">

  <link rel="icon" href="assets/images/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="shortcut icon" href="assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css?v=16">
  <link rel="alternate" type="application/rss+xml" title="L1MA0" href="feed.xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div class="progress" id="progress"></div>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#/" id="brand">L1MA0</a>
      <nav class="site-nav" aria-label="主导航">
        <ul>
          <li><a href="#/" data-nav="list">文章</a></li>
          <li><a href="#/tags" data-nav="tags">标签</a></li>
          <li><a href="#/about" data-nav="about">关于</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换主题">☾</button>
    </div>
  </header>

  <main class="shell" id="app">
    <!-- 内容由 app.js 渲染 -->
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>© <span data-year>2026</span> L1MA0</span>
      <span><a href="feed.xml">RSS</a> · <a href="#/">回到首页</a> · 纯 HTML 手写</span>
    </div>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="回到顶部">↑</button>

  <!-- ?v= 是缓存版本号：改了 js/css 之后把数字 +1，浏览器就会立刻拉新的 -->
  <script src="assets/js/posts.js?v=16"></script>
  <script src="assets/js/app.js?v=16"></script>
  <script src="assets/js/main.js?v=16"></script>
</body>
</html>
